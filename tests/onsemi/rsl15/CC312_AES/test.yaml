# onsemi RSL15 SDK sample `CC312_AES` (CMSIS-Pack ONSemiconductor.RSL15 1.12.374), unmodified: runs its
# known-answer tests on the CryptoCell-312 and logs the verdict over SEGGER RTT (swmTrace RTT), which
# the fixture reads. The PASS line is the sample's own.
# Not vendored (onsemi Software Use Agreement): ../build_sdk.py <pack> .. writes CC312_AES.elf here.
mcu: RSL15
elf: CC312_AES.elf
elf_external: true
timeout: 20
rtt: true
expect:
  - "-PASS-Encryption/Decryption operation"
expect_absent:
  - "-FAIL-"
