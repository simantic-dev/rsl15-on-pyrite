# onsemi RSL15 SDK sample `CC312_RSA` (CMSIS-Pack ONSemiconductor.RSL15 1.12.374), unmodified: runs its
# known-answer tests on the CryptoCell-312 and logs the verdict over SEGGER RTT (swmTrace RTT), which
# the fixture reads. The PASS line is the sample's own. Includes 2048-bit key generation (e = 3), ~91 s virtual.
# Not vendored (onsemi Software Use Agreement): ../build_sdk.py <pack> .. writes CC312_RSA.elf here.
mcu: RSL15
elf: CC312_RSA.elf
elf_external: true
overlay: overlay.board
timeout: 92
rtt: true
expect:
  - "-PASS-RSA"
expect_absent:
  - "-FAIL-"
